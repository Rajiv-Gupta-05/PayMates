<div class="app-layout d-flex vh-100 overflow-hidden">

<!-- Global top-bar loader — async pipe avoids NG0100 -->
<div class="global-loader-bar" [class.active]="isLoading$ | async"></div>

  <!-- Desktop Sidebar -->
  <aside class="glass-sidebar d-none d-md-flex flex-column p-4">
    <div class="brand mb-5">
      <h3 class="fw-bold m-0">PayMates<span style="color: #00ffcc;">.</span></h3>
    </div>

    <nav class="nav flex-column gap-2 flex-grow-1">
      <a routerLink="/dashboard" routerLinkActive="active-link" class="nav-link text-light rounded-3 d-flex align-items-center gap-3 py-3 px-3">
        <i class="bi bi-grid-1x2-fill"></i> Dashboard
      </a>
      <a routerLink="/groups" routerLinkActive="active-link" class="nav-link text-light rounded-3 d-flex align-items-center gap-3 py-3 px-3">
        <i class="bi bi-collection-fill"></i> Groups
      </a>
      <a routerLink="/friends" routerLinkActive="active-link" class="nav-link text-light rounded-3 d-flex align-items-center gap-3 py-3 px-3">
        <i class="bi bi-people-fill"></i> Friends
      </a>
      <a routerLink="/activity" routerLinkActive="active-link" class="nav-link text-light rounded-3 d-flex align-items-center gap-3 py-3 px-3">
        <i class="bi bi-clock-history"></i> Activity
      </a>
      <a routerLink="/analytics" routerLinkActive="active-link" class="nav-link text-light rounded-3 d-flex align-items-center gap-3 py-3 px-3">
        <i class="bi bi-bar-chart-fill"></i> Analytics
      </a>
    </nav>

    <div class="user-profile d-flex align-items-center gap-3 mt-auto glass-card p-3" style="cursor:pointer;" data-bs-toggle="modal" data-bs-target="#profileModal" title="Profile Settings">
      <div class="avatar-initials rounded-circle d-flex justify-content-center align-items-center fw-bold text-dark flex-shrink-0"
           style="width:40px;height:40px;background:linear-gradient(135deg,#00ffcc,#007bff);font-size:14px;overflow:hidden;">
        <img *ngIf="currentUser?.avatar" [src]="currentUser.avatar" alt="Avatar" style="width:100%;height:100%;object-fit:cover;">
        <span *ngIf="!currentUser?.avatar">{{ getInitials() }}</span>
      </div>
      <div class="user-info overflow-hidden flex-grow-1">
        <h6 class="m-0 text-truncate">{{ currentUser?.name || 'User' }}</h6>
        <small class="text-secondary">Profile Settings</small>
      </div>
      <i class="bi bi-gear text-secondary"></i>
    </div>
  </aside>

  <!-- Main Content -->
  <main class="flex-grow-1 position-relative overflow-y-auto mobile-content-pad pb-md-0">
    <!-- Mobile Header -->
    <header class="d-md-none d-flex justify-content-between align-items-center p-3 glass-header sticky-top">
      <h4 class="fw-bold m-0">PayMates<span style="color: #00ffcc;">.</span></h4>
      <div class="d-flex align-items-center gap-3">
        <a routerLink="/analytics" routerLinkActive="text-info" class="text-decoration-none d-flex align-items-center" style="color: #00ffcc;">
          <i class="bi bi-bar-chart-fill fs-4"></i>
        </a>
        <div class="avatar-initials rounded-circle d-flex justify-content-center align-items-center fw-bold text-dark"
             style="width:35px;height:35px;background:linear-gradient(135deg,#00ffcc,#007bff);font-size:12px;cursor:pointer;overflow:hidden;"
             data-bs-toggle="modal" data-bs-target="#profileModal">
          <img *ngIf="currentUser?.avatar" [src]="currentUser.avatar" alt="Avatar" style="width:100%;height:100%;object-fit:cover;">
          <span *ngIf="!currentUser?.avatar">{{ getInitials() }}</span>
        </div>
      </div>
    </header>

    <div class="container-fluid p-3 p-md-5">
      <router-outlet></router-outlet>
    </div>
  </main>

  <!-- Mobile Bottom Nav -->
  <nav class="mobile-nav d-md-none glass-bottom-nav position-fixed bottom-0 w-100 d-flex justify-content-around align-items-center p-2 z-3">
    <a routerLink="/dashboard" routerLinkActive="mobile-active" class="nav-link text-secondary text-center p-2 d-flex flex-column align-items-center">
      <i class="bi bi-grid-1x2-fill fs-4"></i>
      <small class="mt-1">Home</small>
    </a>
    <a routerLink="/groups" routerLinkActive="mobile-active" class="nav-link text-secondary text-center p-2 d-flex flex-column align-items-center">
      <i class="bi bi-collection-fill fs-4"></i>
      <small class="mt-1">Groups</small>
    </a>

    <div class="fab-container position-relative" style="top:-20px;">
      <button class="btn btn-gradient rounded-circle shadow-lg d-flex justify-content-center align-items-center"
              style="width:60px;height:60px;" data-bs-toggle="modal" data-bs-target="#addExpenseModal">
        <i class="bi bi-plus-lg fs-2 text-dark"></i>
      </button>
    </div>

    <a routerLink="/friends" routerLinkActive="mobile-active" class="nav-link text-secondary text-center p-2 d-flex flex-column align-items-center">
      <i class="bi bi-people-fill fs-4"></i>
      <small class="mt-1">Friends</small>
    </a>
    <a routerLink="/activity" routerLinkActive="mobile-active" class="nav-link text-secondary text-center p-2 d-flex flex-column align-items-center">
      <i class="bi bi-clock-history fs-4"></i>
      <small class="mt-1">Activity</small>
    </a>
  </nav>
</div>

<app-add-expense></app-add-expense>

<!-- Profile Settings Modal -->
<div class="modal fade" id="profileModal" tabindex="-1">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content glass-modal border-0">
      <div class="modal-accent-bar"></div>
      <div class="modal-header border-0 pb-0 pt-4 px-4">
        <h5 class="modal-title fw-bold d-flex align-items-center gap-2">
          <i class="bi bi-person-circle text-light"></i> Profile Settings
        </h5>
        <button type="button" class="btn-close btn-close-white" id="closeProfileModal" data-bs-dismiss="modal"></button>
      </div>

      <div class="modal-body p-4">
        <div *ngIf="profileSuccessMessage" class="alert py-2 mb-3 text-center"
             style="background:rgba(0,255,204,0.1);border:1px solid rgba(0,255,204,0.3);color:#00ffcc;">
          <i class="bi bi-check-circle-fill me-2"></i>{{ profileSuccessMessage }}
        </div>
        <div *ngIf="profileErrorMessage" class="alert alert-danger py-2 mb-3">{{ profileErrorMessage }}</div>

        <form [formGroup]="profileForm">
          <div class="mb-3 text-center">
            <div class="avatar-initials rounded-circle d-flex justify-content-center align-items-center fw-bold text-dark mx-auto mb-2"
                 style="width:80px;height:80px;background:linear-gradient(135deg,#00ffcc,#007bff);font-size:24px;overflow:hidden;">
              <img *ngIf="profileForm.value.avatar || currentUser?.avatar" [src]="profileForm.value.avatar || currentUser?.avatar" alt="Avatar" style="width:100%;height:100%;object-fit:cover;">
              <span *ngIf="!(profileForm.value.avatar || currentUser?.avatar)">{{ getInitials() }}</span>
            </div>
            <label class="form-label text-secondary small">Avatar URL</label>
            <input type="text" class="form-control glass-input text-center" formControlName="avatar" placeholder="https://example.com/avatar.png">
          </div>

          <div class="mb-3">
            <label class="form-label text-secondary small">Name</label>
            <input type="text" class="form-control glass-input" formControlName="name">
          </div>

          <div class="mb-3">
            <label class="form-label text-secondary small">Phone Number</label>
            <div class="input-group">
              <span class="input-group-text glass-input" style="border-right: none; color: #adb5bd;">+91</span>
              <input type="text" class="form-control glass-input" formControlName="phone" placeholder="9876543210" style="border-left: none;">
            </div>
          </div>
          
          <div class="mb-4">
            <label class="form-label text-secondary small">Email</label>
            <input type="email" class="form-control glass-input" formControlName="email" readonly style="opacity: 0.7;">
          </div>

          <div class="d-flex gap-3 mt-4">
            <button type="button" class="btn btn-outline-danger w-50 py-2 rounded-pill fw-bold" (click)="logout()">
              <i class="bi bi-box-arrow-right me-2"></i>Logout
            </button>
            <button type="button" class="btn btn-gradient w-50 py-2 rounded-pill fw-bold"
                    (click)="updateProfile()" [disabled]="profileForm.invalid || isUpdatingProfile">
              <span *ngIf="isUpdatingProfile" class="spinner-border spinner-border-sm me-2"></span>
              {{ isUpdatingProfile ? 'Saving...' : 'Save Changes' }}
            </button>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>

<!-- Full Screen Loader Overlay -->
<div *ngIf="isLoggingOut" class="loader-overlay">
  <div class="loader-content text-center">
    <div class="custom-spinner mb-3"></div>
    <h5 class="text-light fw-semibold m-0" style="letter-spacing: 1px;">Logging Out...</h5>
  </div>
</div>

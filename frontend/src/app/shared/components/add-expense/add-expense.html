<div class="modal fade" id="addExpenseModal" tabindex="-1" aria-labelledby="addExpenseModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content glass-modal border-0 overflow-hidden">

            <div class="modal-accent-bar"></div>

            <div class="modal-header border-0 pb-0 pt-4 px-4">
                <h5 class="modal-title fw-bold d-flex align-items-center gap-2" id="addExpenseModalLabel">
                    <i class="bi bi-receipt-cutoff text-light"></i> New Expense
                </h5>
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"
                    aria-label="Close"></button>
            </div>

            <div class="modal-body p-4 p-md-5">
                <form>

                    <div class="text-center mb-5">
                        <label class="text-secondary small text-uppercase fw-semibold tracking-wider mb-2">Total
                            Amount</label>
                        <div class="d-flex justify-content-center align-items-center">
                            <span class="text-info fs-1 fw-bold me-1">$</span>
                            <input type="number" class="form-control amount-input text-info" id="expenseAmount"
                                placeholder="0.00">
                        </div>
                    </div>

                    <div class="custom-input-group mb-4">
                        <i class="bi bi-card-text text-secondary ps-4"></i>
                        <input type="text" class="form-control glass-input" id="expenseDesc"
                            placeholder="What was this for? (e.g. Dinner)">
                    </div>

                    <div class="custom-input-group mb-4 dropdown">
                        <i class="bi bi-people text-secondary ps-4 z-1"></i>

                        <button
                            class="btn glass-input w-100 text-start d-flex justify-content-between align-items-center dropdown-toggle"
                            type="button" id="groupDropdown" data-bs-toggle="dropdown" aria-expanded="false">
                            <span class="text-light ms-2">No group (Individual)</span>
                        </button>

                        <ul class="dropdown-menu glass-dropdown-menu w-100 mt-2 p-2 shadow-lg"
                            aria-labelledby="groupDropdown">
                            <li>
                                <button
                                    class="dropdown-item glass-dropdown-item rounded-3 active d-flex align-items-center gap-2 py-2"
                                    type="button">
                                    <div class="avatar rounded-circle bg-secondary bg-opacity-25 text-light d-flex justify-content-center align-items-center"
                                        style="width: 30px; height: 30px;">
                                        <i class="bi bi-person"></i>
                                    </div>
                                    No group (Individual)
                                </button>
                            </li>
                            <li>
                                <hr class="dropdown-divider border-secondary border-opacity-25 my-2">
                            </li>
                            <li>
                                <button
                                    class="dropdown-item glass-dropdown-item rounded-3 d-flex align-items-center gap-2 py-2"
                                    type="button">
                                    <div class="avatar rounded-circle bg-gradient d-flex justify-content-center align-items-center"
                                        style="width: 30px; height: 30px; background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 100%); color: #333;">
                                        🏖️
                                    </div>
                                    Goa Trip 2026
                                </button>
                            </li>
                            <li>
                                <button
                                    class="dropdown-item glass-dropdown-item rounded-3 d-flex align-items-center gap-2 py-2 mt-1"
                                    type="button">
                                    <div class="avatar rounded-circle bg-gradient d-flex justify-content-center align-items-center"
                                        style="width: 30px; height: 30px; background: linear-gradient(135deg, #a1c4fd 0%, #c2e9fb 100%); color: #333;">
                                        🏠
                                    </div>
                                    Downtown Apartment
                                </button>
                            </li>
                        </ul>
                    </div>

                    <div class="split-logic-btn mb-5 p-3 rounded-4 d-flex justify-content-between align-items-center"
                        role="button">
                        <div class="d-flex align-items-center gap-3 w-100 overflow-hidden">

                            <div class="avatar rounded-circle bg-gradient text-dark d-flex justify-content-center align-items-center fs-5 shadow-sm flex-shrink-0"
                                style="width: 45px; height: 45px; background: linear-gradient(135deg, #00ffcc, #007bff);">
                                <i class="bi bi-pie-chart-fill"></i>
                            </div>

                            <div class="text-truncate flex-grow-1 fs-6 text-secondary" style="letter-spacing: 0.3px;">
                                Paid by
                                <span class="badge border border-info text-info rounded-pill px-3 py-2 mx-1 fw-bold"
                                    style="background: rgba(0, 255, 204, 0.1);">You</span>
                                and split
                                <span class="badge border border-light text-light rounded-pill px-3 py-2 mx-1 fw-bold"
                                    style="background: rgba(255, 255, 255, 0.1);">Equally</span>
                            </div>

                        </div>

                        <i class="bi bi-chevron-right text-secondary ms-2 flex-shrink-0"></i>
                    </div>

                    <button type="button" class="btn btn-gradient w-100 py-3 rounded-pill fs-5 shadow-lg fw-bold"
                        data-bs-dismiss="modal">
                        Save Expense
                    </button>

                </form>
            </div>
        </div>
    </div>
</div>

<div class="groups-wrapper">
  <div class="d-flex justify-content-between align-items-center gap-3 mb-5">
    <div>
      <h2 class="fw-bold mb-1">Groups</h2>
      <p class="text-secondary m-0">Manage your shared spaces.</p>
    </div>
    <div class="d-flex gap-2">
      <button class="btn btn-gradient d-none d-md-flex align-items-center justify-content-center gap-2 px-3 px-md-4 py-2 rounded-pill flex-grow-1 flex-md-grow-0" data-bs-toggle="modal" data-bs-target="#addExpenseModal">
        <i class="bi bi-plus-lg"></i> Add Expense
      </button>
      <button class="btn btn-gradient d-flex align-items-center justify-content-center gap-2 px-3 px-md-4 py-2 rounded-pill flex-grow-1 flex-md-grow-0">
        <i class="bi bi-plus-lg"></i> Create Group
      </button>
    </div>
  </div>

  <div class="row g-4">
    <div class="col-12 col-md-6 col-xl-4">
      <div class="glass-card p-4 h-100 transition-hover">
        <div class="d-flex justify-content-between align-items-start mb-3">
          <div class="avatar rounded-3 bg-gradient d-flex justify-content-center align-items-center fs-4" style="width: 50px; height: 50px; background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 99%, #fecfef 100%); color: #333;">🏖️</div>
          <span class="badge bg-success bg-opacity-25 text-success border border-success border-opacity-50">Settled</span>
        </div>
        <h4 class="fw-bold mb-1">Goa Trip 2026</h4>
        <p class="text-secondary small mb-4">4 members</p>
        <div class="border-top border-secondary border-opacity-25 pt-3">
          <p class="m-0 text-secondary">Your balance: <span class="text-light fw-bold">$0.00</span></p>
        </div>
      </div>
    </div>

    <div class="col-12 col-md-6 col-xl-4">
      <div class="glass-card p-4 h-100 transition-hover border-danger border-opacity-50">
        <div class="d-flex justify-content-between align-items-start mb-3">
          <div class="avatar rounded-3 bg-gradient d-flex justify-content-center align-items-center fs-4" style="width: 50px; height: 50px; background: linear-gradient(135deg, #a1c4fd 0%, #c2e9fb 100%); color: #333;">🏠</div>
          <span class="badge bg-danger bg-opacity-25 text-danger border border-danger border-opacity-50">You owe</span>
        </div>
        <h4 class="fw-bold mb-1">Downtown Apartment</h4>
        <p class="text-secondary small mb-4">3 members</p>
        <div class="border-top border-secondary border-opacity-25 pt-3">
          <p class="m-0 text-secondary">Your balance: <span class="text-danger fw-bold">-$120.00</span></p>
        </div>
      </div>
    </div>
  </div>
</div>

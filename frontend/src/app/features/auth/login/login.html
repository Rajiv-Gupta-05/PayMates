<div class="container-fluid p-0">
  <div class="row vh-100 g-0">

    <div class="col-lg-6 d-none d-lg-flex flex-column justify-content-center align-items-center position-relative">
      <div class="text-center z-1">
        <h1 class="display-3 fw-bold mb-3">PayMates<span style="color: #00ffcc;">.</span></h1>
        <p class="lead text-light opacity-75">Less Math, More Memories. ✨</p>
      </div>
    </div>

    <div class="col-lg-6 col-12 d-flex justify-content-center align-items-center p-4">
      <div class="glass-card p-5 w-100" style="max-width: 450px;">

        <div class="text-center d-lg-none mb-4">
          <h2 class="fw-bold">PayMates<span style="color: #00ffcc;">.</span></h2>
        </div>

        <h3 class="mb-1 fw-bold">Welcome back</h3>
        <p class="text-secondary mb-4">Enter your details to access your account.</p>

        <!--
          Google Sign-In area
        -->
        <div id="google-btn-wrapper" class="google-btn-wrapper mb-4">

          <!-- Visual layer — shown to the user -->
          <div class="google-btn-visual d-flex justify-content-center align-items-center gap-2">
            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 48 48">
              <path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/>
              <path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/>
              <path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/>
              <path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.18 1.48-4.97 2.31-8.16 2.31-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/>
              <path fill="none" d="M0 0h48v48H0z"/>
            </svg>
            <span>Log in with Google</span>
          </div>

          <!-- GIS interaction layer — invisible but clickable, sits on top -->
          <div id="gis-btn-container"></div>
        </div>

        <div class="d-flex align-items-center mb-4">
          <hr class="flex-grow-1 border-secondary">
          <span class="mx-3 text-secondary small">OR</span>
          <hr class="flex-grow-1 border-secondary">
        </div>

        <div *ngIf="errorMessage" class="alert alert-danger py-2 mb-3">
          <i class="bi bi-exclamation-triangle me-2"></i>{{ errorMessage }}
        </div>

        <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
          <div class="mb-3">
            <div class="form-floating">
              <input type="email" class="form-control rounded-3" id="emailInput" placeholder="name@example.com" formControlName="email"
                     [class.is-invalid]="loginForm.get('email')?.invalid && loginForm.get('email')?.touched">
              <label for="emailInput">Email address</label>
            </div>
            <div *ngIf="loginForm.get('email')?.invalid && loginForm.get('email')?.touched" class="text-danger small mt-1 ps-2">
              <span *ngIf="loginForm.get('email')?.errors?.['required']">Email is required.</span>
              <span *ngIf="loginForm.get('email')?.errors?.['email']">Please enter a valid email address.</span>
            </div>
          </div>

          <div class="mb-4">
            <div class="form-floating position-relative">
              <input [type]="showPassword ? 'text' : 'password'" class="form-control rounded-3 pe-5" id="passwordInput" placeholder="Password" formControlName="password"
                     [class.is-invalid]="loginForm.get('password')?.invalid && loginForm.get('password')?.touched">
              <label for="passwordInput">Password</label>
              <button type="button" class="password-toggle-btn" (click)="showPassword = !showPassword" aria-label="Toggle password visibility">
                <i class="bi" [class.bi-eye-fill]="showPassword" [class.bi-eye-slash-fill]="!showPassword"></i>
              </button>
            </div>
            <div *ngIf="loginForm.get('password')?.invalid && loginForm.get('password')?.touched" class="text-danger small mt-1 ps-2">
              <span *ngIf="loginForm.get('password')?.errors?.['required']">Password is required.</span>
            </div>
          </div>

          <button type="submit" class="btn btn-gradient w-100 py-3 rounded-3 fw-bold" [disabled]="loginForm.invalid">
            Sign In
          </button>
        </form>

        <p class="text-center mt-4 mb-0 text-secondary">
          Don't have an account? <a routerLink="/register" class="text-decoration-none" style="color: #00ffcc;">Sign up here</a>
        </p>
      </div>
    </div>
  </div>
</div>

<!-- Full Screen Loader Overlay -->
<div *ngIf="isLoading" class="loader-overlay">
  <div class="loader-content text-center">
    <div class="custom-spinner mb-3"></div>
    <h5 class="text-light fw-semibold m-0" style="letter-spacing: 1px;">Authenticating...</h5>
  </div>
</div>
